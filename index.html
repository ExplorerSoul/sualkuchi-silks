<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sualkuchi Heritage Silks</title>
    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="modules/products/products.css">
</head>
<body>

    <!-- Shared UI Injector mounts header here -->
    <header></header>

    <div class="hero">
        <h1>The Golden Thread of Assam</h1>
        <p>Authentic handwoven Muga and Paat Mekhela Sador, direct from the hands of Sualkuchi's weavers.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Our Latest Collection</h2>
        
        <div class="grid" id="product-grid">
            <p style="text-align:center; width:100%;">Loading our collection...</p>
        </div>
    </div>

    <!-- Shared UI Injector mounts footer here -->
    <footer></footer>

    <!-- Shared core UI injection script -->
    <script type="module" src="./modules/core/ui.js"></script>

    <!-- Page rendering script -->
    <script type="module">
        import { fetchProducts } from './modules/products/products.js';
        import { renderProductCard } from './modules/products/product-card.js';

        const grid = document.getElementById('product-grid');

        async function loadCollection() {
            try {
                const products = await fetchProducts();
                
                if (products.length === 0) {
                    grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No products found.</p>";
                    return;
                }

                grid.innerHTML = ""; 
                products.forEach((product) => {
                    grid.innerHTML += renderProductCard(product);
                });
            } catch (error) {
                console.error("Error loading products:", error);
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--error);'>Failed to load products. Please try again later.</p>";
            }
        }

        loadCollection();
    </script>

</body>
</html>
